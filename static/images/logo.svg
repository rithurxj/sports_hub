<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gradCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon Group -->
  <g transform="translate(4, 4)">
    <!-- Outer Shield Background -->
    <path d="M28 2L50 12V32C50 45.2 39.5 54 28 56C16.5 54 6 45.2 6 32V12L28 2Z" 
          fill="#0B132B" stroke="url(#gradEmerald)" stroke-width="2.5" />
    
    <!-- Stadium Pitch Turf Stripes Inside Shield -->
    <path d="M12 20L44 20" stroke="rgba(16, 185, 129, 0.25)" stroke-width="2" />
    <path d="M10 28L46 28" stroke="rgba(16, 185, 129, 0.35)" stroke-width="2" />
    <path d="M12 36L44 36" stroke="rgba(16, 185, 129, 0.25)" stroke-width="2" />
    <circle cx="28" cy="28" r="8" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" fill="none" />
    
    <!-- Dynamic Athletic Velocity Swoosh -->
    <path d="M4 42C12 50 32 50 48 24C36 34 20 36 10 32" 
          fill="url(#gradCyan)" filter="url(#glow)" />
    
    <!-- Radiant Golden Ball / Star Spark -->
    <circle cx="28" cy="28" r="4.5" fill="url(#gradGold)" filter="url(#glow)" />
    <circle cx="28" cy="28" r="2" fill="#FFFFFF" />
    
    <!-- Top Crown Accent -->
    <polygon points="28,2 34,9 22,9" fill="url(#gradGold)" />
  </g>

  <!-- Wordmark Text -->
  <g transform="translate(68, 12)">
    <!-- Main Title -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', 'Outfit', system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#0F172A">
      SPORTS<tspan fill="#10B981">HUB</tspan>
    </text>
    
    <!-- Subtitle / Tagline Badge -->
    <g transform="translate(0, 31)">
      <rect x="0" y="0" width="138" height="15" rx="3" fill="#ECFDF5" />
      <circle cx="6" cy="7.5" r="2.5" fill="#10B981" />
      <text x="13" y="10.5" font-family="'Inter', system-ui, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1" fill="#047857">
        TURF &amp; COURT BOOKING
      </text>
    </g>
  </g>
</svg>
